name: Draft Android release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build, such as v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK, app bundle, and portable website
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      THEMEALDB_API_KEY: ${{ secrets.THEMEALDB_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD THEMEALDB_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository secrets."
              missing=1
            fi
          done
          test "$missing" -eq 0
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:verify "$RELEASE_TAG"

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test meal planner
        run: pnpm test

      - name: Require releasable ingredient images
        run: pnpm images:audit:strict

      - name: Test thumb-drive backup and recovery
        shell: pwsh
        run: ./work/test-server-recovery.ps1

      - name: Synchronize Android project
        run: pnpm android:sync

      - name: Build signed release files
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release-keystore.jks
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease assembleRelease bundleRelease

      - name: Verify release signatures
        run: |
          apk_signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apk_signer"
          "$apk_signer" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk
          if ! jarsigner -verify \
            android/app/build/outputs/bundle/release/app-release.aab \
            > /tmp/aab-signature-check.log 2>&1; then
            cat /tmp/aab-signature-check.log
            exit 1
          fi
          echo "Android App Bundle signature verified."

      - name: Package release files
        run: |
          pnpm release:stage
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/Bob-and-Marys-Meal-Planner-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "dist/Bob-and-Marys-Meal-Planner-${RELEASE_TAG}.aab"
          (
            cd work/release-web
            zip -9 -r "../../dist/Bob-and-Marys-Meal-Planner-Thumb-Drive-${RELEASE_TAG}.zip" \
              meal-planner
          )
          cd dist
          sha256sum *.apk *.aab *.zip > SHA256SUMS.txt

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bob-and-marys-meal-planner-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create or update draft GitHub release
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Refusing to replace an already published release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
            if [ -f "$notes_file" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "Bob and Mary's Meal Planner ${RELEASE_TAG}" \
                --notes-file "$notes_file"
            fi
          elif [ -f "$notes_file" ]; then
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --notes-file "$notes_file" \
              --verify-tag \
              --title "Bob and Mary's Meal Planner ${RELEASE_TAG}"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --generate-notes \
              --verify-tag \
              --title "Bob and Mary's Meal Planner ${RELEASE_TAG}"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f android/release-keystore.jks
