name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Web tests and Android APK
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test meal planner
        run: pnpm test

      - name: Report ingredient image provenance
        run: pnpm images:audit

      - name: Test thumb-drive server, backup, and recovery
        shell: pwsh
        run: |
          ./work/test-recipe-server.ps1
          ./work/test-server-recovery.ps1

      - name: Synchronize Android project
        run: pnpm android:sync

      - name: Lint and build debug APK
        run: node work/run-gradle.mjs lintDebug assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          short_sha="${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/Supperloom-debug-${short_sha}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Build matching APK for upgrade testing
        run: |
          node work/build-android-upgrade-baseline.mjs \
            --output upgrade-dist/Supperloom-baseline.apk
          cd upgrade-dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bob-and-marys-meal-planner-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload upgrade-test baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bob-and-marys-meal-planner-upgrade-baseline-${{ github.sha }}
          path: upgrade-dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  native-android:
    name: Native ${{ matrix.label }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android 7 phone
            api: 24
            release: "7.0"
            profile: pixel_2
            layout: phone
            upgrade: false
            extra: ""
          - label: Android 15 phone and upgrade
            api: 35
            release: "15"
            profile: pixel_2
            layout: phone
            upgrade: true
            extra: "--upgrade --online --offline --large-text"
          - label: Android 15 tablet
            api: 35
            release: "15"
            profile: pixel_c
            layout: tablet
            upgrade: false
            extra: ""

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        if: matrix.upgrade
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: ${{ matrix.upgrade && 'pnpm' || '' }}

      - name: Set up Java
        if: matrix.upgrade
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle caching
        if: matrix.upgrade
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install build dependencies for upgrade test
        if: matrix.upgrade
        run: pnpm install --frozen-lockfile

      - name: Download the exact APK built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bob-and-marys-meal-planner-debug-${{ github.sha }}
          path: dist

      - name: Download the matching upgrade baseline
        if: matrix.upgrade
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bob-and-marys-meal-planner-upgrade-baseline-${{ github.sha }}
          path: upgrade-dist

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK on ${{ matrix.label }}
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            node work/run-android-smoke.mjs
            --apk dist
            --api ${{ matrix.api }}
            --release ${{ matrix.release }}
            --layout ${{ matrix.layout }}
            ${{ matrix.upgrade && '--baseline upgrade-dist' || '' }}
            ${{ matrix.extra }}
